schema_version = "m4a-1"
acceptance_id = "pocky_provisional_m4c"
notes = """
Provisional frozen acceptance configuration for the Pocky dispenser, recorded before any M6
candidate evaluation. These are engineering defaults from architecture section 21 and the
current CAD envelope, NOT bench measurements. No candidate, sweep, or adapter may tune them.

Governing numbers: rigid packet envelope 165 x 55 x 5.2 mm; exactly one packet identity;
leading edge at least 30 mm beyond the outer face x = 88 mm; 40 mm is a recorded target only;
at least 10 mm exposed beyond the 18 mm lip shelf ending at x = 106 mm; continuous supported
dwell of at least 0.5 s after real zero input release, with protrusion change at most 1 mm;
actual gravity-normal contact support with the projected packet COM inside the support hull;
no uncontrolled fallout, no second packet, and no support loss through the bounded window.

M5a must still evaluate housing stability (S0) and pair-aware non-packet penetration
(<= 0.2 mm) with the real assembly; those product predicates are not expressed here because
this M4c generic event schema cannot name moving-part pairs or the S0 load paths. Rigid-proxy
limitations remain: wrapper flexibility, adhesion and candy damage are not predicted.

The event `bodies` list is the declared candidate identity set. M5a must bind every packet
body that could escape to an ID in this frozen list (or extend this list before candidate
evaluation); a second packet under an undeclared body ID is a configuration error, not a
pass. Do not narrow this set to the presented packet alone.
"""

[[events]]
name = "packet_exit"
kind = "exit_crossing"
bodies = ["packet"]
object_half_extents_m = [0.0825, 0.0275, 0.0026]
window_from = "actuate"
window_to = "hold"

[events.plane]
point_m = [0.088, 0.0, 0.0]
normal = [1.0, 0.0, 0.0]
direction = 1

[[events]]
name = "packet_presentation"
kind = "supported_presentation"
bodies = ["packet"]
object_half_extents_m = [0.0825, 0.0275, 0.0026]
window_from = "actuate"
window_to = "hold"
release_phase = "release"
dwell_from = "release"
dwell_to = "hold"
min_protrusion_m = 0.030
target_protrusion_m = 0.040
min_accessible_m = 0.010
dwell_min_s = 0.5
protrusion_change_max_m = 0.001
support_bodies = ["lip", "body"]
min_support_load_fraction = 0.6
support_hull_margin_m = 0.001
support_hull_min_area_m2 = 0.00001
support_degeneracy_radius_m = 0.002
max_terminal_speed_m_s = 0.01
fallout_drop_m = 0.02

[events.plane]
point_m = [0.088, 0.0, 0.0]
normal = [1.0, 0.0, 0.0]
direction = 1

[events.access_plane]
point_m = [0.106, 0.0, 0.0]
normal = [1.0, 0.0, 0.0]
direction = 1

[events.bounds_m]
x = [-0.10, 0.25]
y = [-0.10, 0.10]
z = [-0.03, 0.08]

[[checks]]
name = "exactly_one_packet"
kind = "event_count"
event = "packet_exit"
expected = 1
tolerance = 0
units = "count"

[[checks]]
name = "pickup_ready"
kind = "event_verdict"
event = "packet_presentation"
units = "state"
