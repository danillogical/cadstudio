# Single source of truth for the Pocky dispenser (all mm unless noted).
# Defaults come from plan-pockey-dispenser.md section 4; MEASURE the starred ones on real packets.

[packet]
length = 165.0  # MEASURE: outside length over several wrapped packets (user nominal)
width = 55.0    # MEASURE: outside width over several wrapped packets (user nominal)
height = 5.2    # user-measured thickness; record the method, do not assume it holds under stack load

[magazine]
length_i = 170.0    # internal length, ~2.5 mm clearance per end; adjust for crinkled seals
width_i = 60.0      # internal width, ~2.5 mm clearance per side
headroom = 20.0     # loading room above the stack (plan range 15-25); tune by printing
capacity_test = 10  # packets in the current test; 25 is the second test (same mechanism must work)

[separator]
gap = 5.75  # trial value from the 5.5-6.0 range; must pass one packet but reject two compressed ones; adjustable by shims

[syringe3]
exit_gap = 7.8            # exit window height, 1.5x packet.height: passes one packet, and the wall still covers 2.6 mm of packet 2
bore_length = 176.0       # syringe3 bore along X; the exit end stays at x=85 and the bore grows at the back for the 8 mm rear ramp (syringe keeps magazine.length_i)
target_protrusion = 75.0  # presented packet's leading edge past the exit wall at full stroke (57 past the shelf), so it is easy to grab
min_protrusion = 65.0     # smallest acceptable protrusion (sets stroke_min)
min_past_shelf = 47.0     # the leading edge must clear the shelf end by this much (exit + 65 = shelf + 47)
plate_z0 = 0.2            # pusher plate underside, above the floor top
plate_h = 4.7             # pusher plate thickness; its top (4.9, the slider print face) stays 0.3 under packet 2's underside
slot_h = 5.2              # rear wall slot height the plate runs in, 0.3 over the plate; also the rear ramp's underside

[structure]
min_wall = 2.4  # minimum printable wall thickness (checked by min_wall)

[printer]
bed_x = 360  # Prusa XL usable bed X
bed_y = 360  # Prusa XL usable bed Y
bed_z = 360  # Prusa XL max print height

[material]
name = "PETG"
density_g_cm3 = 1.27  # filament datasheet density
filament_d = 1.75     # filament diameter, mm
