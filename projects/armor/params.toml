# Single source of truth for lid + shell parameters (all mm unless noted).
# Defaults come from armor-p1.scad; MEASURE the starred ones on the real lid.

[lid]
w = 286.7       # MEASURE: full lid width, side edge to side edge
h = 193       # MEASURE: lid height from the hinge-side edge to the top edge
t = 7.0       # MEASURE: lid thickness at the thickest point (front face to back face) -- calipers

[screen]
w = 260       # MEASURE: active display width (visible lit area), centered in X
h = 147       # MEASURE: active display height (visible lit area)
bottom = 27.0 # MEASURE: distance from the lid hinge edge to the bottom of the active area
corner_r = 2.0  # radius of the active-area corners (clearance cut-out in the front bezel)

[camera]
w = 20        # MEASURE: width of the camera notch/bump region, centered in X
h = 8         # MEASURE: height of the camera notch/bump region
top_offset = 8  # MEASURE: gap from the lid top edge down to the top edge of the camera notch
notch = false   # false = bezel covers the camera; true = cut a notch so the camera can see

[fit]
slide_clearance = 0.7      # per-side gap around the lid so the shell slides on freely
rear_gap = 0.5             # gap between lid back face and the rear shell (felt/TPU allowance)
front_gap = 0.8            # gap between lid front face and bezel inner face (must not clamp)
bottom_hinge_relief = 0    # shell stops this far above the hinge edge to clear the hinge
top_extension = 6.0        # how far the shell extends past the lid top edge

[structure]
back_th = 2.4        # rear shell plate thickness
front_th = 2.4       # front bezel plate thickness
min_wall = 2.4       # minimum printable wall thickness anywhere (checked by min_wall)
outer_corner_r = 5.0 # radius of the outer corners of the shell

[fasteners]
screw_d = 3.2            # M3 clearance hole diameter
counterbore_d = 6.2      # screw-head counterbore diameter
counterbore_depth = 1.2  # screw-head counterbore depth
insert_d = 4.5           # MEASURE/tune: hole diameter for the M3 heat-set insert
insert_depth = 5.0       # heat-set insert hole depth
boss_d = 8.0             # outer diameter of the insert boss
boss_margin = 1.2        # extra material kept between boss and neighbouring features

[printer]
bed_x = 360  # Prusa XL usable bed X
bed_y = 360  # Prusa XL usable bed Y
bed_z = 360  # Prusa XL max print height

[material]
name = "PETG"
density_g_cm3 = 1.27  # filament datasheet density
filament_d = 1.75     # filament diameter, mm
